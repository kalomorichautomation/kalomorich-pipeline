name: Upload prepared video

# Builds a long video from files attached to a GitHub release (a short seamless loop, the music and
# the thumbnail) and schedules it on YouTube. The release tag must match a file in videos/<tag>.json.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cozy-snowy-morning)"
        required: true

concurrency: upload-prepared

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install google-api-python-client google-auth
      - name: Download release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -D assets --repo "${{ github.repository }}"
      - name: Build and upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python upload_prepared.py "${{ inputs.tag }}" assets
      - name: Keep details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-details
          path: out/result.json
          retention-days: 30
